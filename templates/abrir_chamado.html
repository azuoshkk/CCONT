<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Abrir Chamado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/abrir_chamado.css') }}">
</head>

<body>
    <div class="container">
        <form class="left" action="/abrir_chamado" method="POST">
            <h1>Novo Chamado</h1>
            <input class="input" type="text" name="titulo" placeholder="Título do Chamado" required>

            <select name="id_materia" required class="input"
                style="margin-bottom: 10px; width: 100%; padding: 10px; background: #202024; border: 1px solid #29292e; color: #fff; border-radius: 5px;">
                <option value="" disabled selected>Selecione o Professor</option>
                {% for opcao in opcoes %}
                    <option value="{{ opcao['id'] }}">{{ opcao['professor_nome'] }} ({{ opcao['materia_nome'] }})</option>
                {% endfor %}
            </select>

            <textarea class="input" name="descricao" placeholder="Descreva o problema..." required
                style="height: 100px; resize: none;"></textarea>

            <button class="btnLogin" type="submit">ENVIAR</button>
            <a href="{{ url_for('dashboard') }}" style="display: block; text-align: center; margin-top: 10px;">Voltar ao
                Painel</a>
        </form>
    </div>
</body>

</html>
